[fan]
##  Print Cooling Fan - FAN0
# pin: PA8
pin: ebb36:PA1
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan Hotend_fan]
##  Hotend Fan - FAN1
# pin: PE5
pin: ebb36:PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[fan_generic Exhaust_Fan]
##  Controller fan - FAN2
pin: PD12
kick_start_time: 0.5
# heater: heater_bed
# fan_speed: 0.2

##  Electronics bay fan - closed loop on the Octopus MCU temperature.
##
##  Was [fan_generic], driven only by PRINT_START: 0.3 during soak, 0 while
##  printing, nothing when idle. So the bay got LESS cooling during a 22h
##  print than during warm-up, and none at all afterwards.
##
##  temperature_fan targets a temperature rather than a speed, so it stays
##  silent while the board is cool and only spins when it actually needs to.
##  max_speed 0.4 is a noise ceiling chosen by ear (2026-08-31).
##  If mcu_temp still climbs past ~60C during a print, raise max_speed.
[temperature_fan MCU_Fan]
pin: PD13
kick_start_time: 0.5
sensor_type: temperature_mcu
sensor_mcu: mcu
control: watermark
max_delta: 3
target_temp: 45
min_temp: 0
max_temp: 100
min_speed: 0.0
max_speed: 0.4

##  PSU fan. No temperature sensor on the PSU, so this runs on activity
##  instead: on whenever the steppers or either heater are working.
##
##  idle_timeout 300 matters more than the speed - the default is 30s, which
##  is far too short after a 110C bed session. The bay holds heat for minutes
##  after a print ends, which is exactly when nothing used to be cooling it.
[controller_fan PSU_Fan]
pin: PD14
kick_start_time: 0.5
fan_speed: 0.4
idle_speed: 0.2
idle_timeout: 300
heater: heater_bed, extruder

[fan_generic nevermore]
##  Controller fan - FAN2
pin: PD15
kick_start_time: 0.5
# heater: heater_bed
# fan_speed: 0.2

