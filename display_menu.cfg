##  eva01 mini12864 menu - reworked 2026-09-18
##
##  Klipper loads its own menu.cfg FIRST (menu.py:716), then this file
##  (menu.py:718). add_menuitem is a dict assignment, so anything declared here
##  REPLACES the stock item of the same name - Klipper logs "hides previous
##  menuitem declaration" when it happens. That is how the fixes below work.
##
##  Two ordering rules, from menu.py:974-983:
##    - index: N inserts at position N in the parent's list. index: 0 = top.
##    - an OVERRIDE keeps the stock item's original position ("not
##      existing_item"), so replacing an item never duplicates or moves it.
##
##  Removed 2026-09-18: [gcode_macro _MENU_LIMITS]. It computed move-step
##  limits into a variable that nothing in this workspace ever read - dead
##  code inherited from a menu config that did use it.


#####################################################################
#  Promoted to the top - the things you actually do standing at the machine
#####################################################################

[menu __main __nozzle_clean]
type: command
index: 0
enable: {not (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: Clean Nozzle
gcode:
    { menu.exit() }
    NOZZLE_CLEAN

[menu __main __toolhead_service]
type: command
index: 1
enable: {not (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: Toolhead Service
gcode:
    { menu.exit() }
    TOOLHEAD_MAINTENANCE


#####################################################################
#  FIX: the stock "OctoPrint" menu was three DEAD buttons
#####################################################################
#
#  The stock items emit the OctoPrint action protocol:
#      {action_respond_info('action:pause')}
#  Moonraker v0.9.3 does not implement that protocol at all - verified by
#  searching the whole source tree. So they printed a line to the console and
#  nothing happened.
#
#  Worse, they are gated on `state == "Printing"`, so they only APPEARED while
#  printing - surfacing exactly when you would reach for them mid-print, and
#  silently doing nothing.
#
#  Repointed at PAUSE / RESUME / CANCEL_PRINT, which are real macros here
#  (mainsail.cfg lines 93 / 114 / 63). Renamed off "OctoPrint" because nothing
#  on this machine is OctoPrint.

[menu __main __octoprint]
type: list
name: Print Control

[menu __main __octoprint __pause]
type: command
enable: {printer.print_stats.state == "printing"}
name: Pause
gcode:
    { menu.exit() }
    PAUSE

[menu __main __octoprint __resume]
type: command
enable: {printer.print_stats.state == "paused"}
name: Resume
gcode:
    { menu.exit() }
    RESUME

[menu __main __octoprint __abort]
type: command
enable: {printer.print_stats.state == "printing" or printer.print_stats.state == "paused"}
name: Cancel Print
gcode:
    { menu.exit() }
    CANCEL_PRINT


#####################################################################
#  FIX: preheat presets did not match this machine
#####################################################################
#  Stock: PLA 200/60, ABS 245/110.  eva01 runs PLA 215/60, ABS 250/110.

[menu __main __temp __preheat_pla __all]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Preheat all
gcode:
    M140 S60
    M104 S215

[menu __main __temp __preheat_pla __hotend]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Preheat hotend
gcode: M104 S215

[menu __main __temp __preheat_abs __all]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Preheat all
gcode:
    M140 S110
    M104 S250

[menu __main __temp __preheat_abs __hotend]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Preheat hotend
gcode: M104 S250


#####################################################################
#  Lights - there was no way to turn them back ON from the screen
#####################################################################

[menu __main __leds_on]
type: command
name: Lights On
gcode: LIGHTS_ON

[menu __main __leds_off]
type: command
name: Lights Off
gcode: SHUTDOWN_ALL_LEDS


#####################################################################
#  Power (unchanged)
#####################################################################

[menu __main]
type: list
name: Main

[menu __main __power_off]
type: command
enable: {not (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: Power Down
gcode:
     M117 Shutdown_RPI
     M118 Shutdown_RPI
     { menu.exit() }
     UPDATE_DELAYED_GCODE ID=shutdown_machine DURATION=1
