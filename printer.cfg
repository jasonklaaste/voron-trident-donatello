[include mainsail.cfg]
[include stealthburner_leds.cfg]
##  Klicky includes REMOVED 2026-09-04 - BTT Eddy Coil conversion.
##  They also override PROBE_ACCURACY, PROBE_CALIBRATE, Z_TILT_ADJUST and
##  BED_MESH_CALIBRATE with dock-aware versions that reference the [probe]
##  section. With [probe] gone those overrides raise
##  "'dict object' has no attribute 'probe'". Removing the includes restores
##  the stock Klipper commands, which is what a fixed probe wants.
##  [respond] and [force_move] lived inside klicky-macros.cfg and are NOT
##  Klicky-specific - re-declared below so PRINT_START's RESPOND still works.
# [include klicky/klicky-probe.cfg]

[respond]

[force_move]
enable_force_move: True
[include bed_mesh.cfg]
##  z_calibration REMOVED 2026-09-04 - it exists to derive Z from a
##  nozzle-touch against a switch, which the Eddy replaces entirely.
# [include auto_z.cfg]
[include stepper.cfg]
[include tmc.cfg]
[include heater.cfg]
[include probe.cfg]
[include fan.cfg]
[include led.cfg]
[include display.cfg]
[include macro.cfg]
[include display_menu.cfg]
[include thermistor.cfg]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

##  Lets a single object be cancelled off a multi-part plate without killing
##  the whole print - the difference between losing one part and losing a
##  22 hour job.
##
##  Needs two things beyond this section:
##    - SuperSlicer: gcode_label_objects = 1   (already set)
##    - Moonraker:   [file_manager] enable_object_processing: True
##  Moonraker rewrites the slicer's "; printing object" comments into
##  EXCLUDE_OBJECT_DEFINE markers AS THE FILE IS UPLOADED, so files already
##  on the printer will not have them. Re-upload anything that needs it.
[exclude_object]

##  Both boards are addressed by-id, not by-path.
##
##  by-path names a physical USB socket on the Pi. Unplug both boards to work
##  on the machine, plug them back the other way round, and Klipper does not
##  error - it attaches the Octopus config to the EBB36 and vice versa, with
##  stepper and heater pins pointing at the wrong board.
##
##  by-id names the board by its own serial number, so a swapped cable is
##  simply found on the other port. Reflashing a board changes nothing here;
##  replacing one means updating its line.
##
##  Previous values, if ever needed:
##    mcu       by-path ...usb-0:1.3:1.0   (Pi port 1.3)
##    mcu ebb36 by-path ...usb-0:1.1:1.0   (Pi port 1.1)
[mcu]
##  BigTreeTech Octopus, STM32F446
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_3D002E001550535556323420-if00

[mcu ebb36]
##  BigTreeTech EBB36, STM32G0B1, over USB (not CAN)
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_11001D000F504B5735313720-if00

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 3000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0


##  ADXL345 PROBE TEST - added 2026-09-15.
##  This EBB36's revision was never confirmed (v1.1 vs v1.2). A v1.2 carries an
##  ONBOARD ADXL345; a v1.1 does not. These are BTT's documented v1.2 pins, and
##  PB2/PB10/PB11/PB12 are confirmed free (the only EBB36 pins in use are
##  PA0, PA1, PA3, PA15, PB6, PB13, PD0-PD3, plus PB3/PB4 for the Eddy I2C).
##
##  CONFIRMED 2026-09-15: ACCELEROMETER_QUERY returned real values, so this
##  board is a v1.2 with a working onboard ADXL345. (Klipper checks the chip ID
##  only when a measurement starts, never at config parse - so the config
##  loading proved nothing; the query is what proved it.)
[adxl345]
cs_pin: ebb36:PB12
spi_software_sclk_pin: ebb36:PB10
spi_software_mosi_pin: ebb36:PB11
spi_software_miso_pin: ebb36:PB2
##  Determined 2026-09-15 from gravity: at rest the sensor reads ~(+6600,
##  -6200, +300) mm/s2, i.e. gravity split 45/45 between sensor +x and -y with
##  sensor z flat. That means sensor z lies horizontal along a printer axis and
##  the board is tilted 45 degrees about printer X - an angled Stealthburner
##  mount. So printer X maps to sensor z and is measured cleanly at full
##  amplitude; printer Y and Z are unavoidably 45 degrees off and share the
##  sensor x/y pair. A 45 degree rotation cannot be expressed in axes_map.
##  Resonance FREQUENCY is unaffected by that - only amplitude - so shaper
##  calibration is still valid on both axes, with Y at ~0.707 signal.
axes_map: z,x,-y

[resonance_tester]
accel_chip: adxl345
probe_points: 150, 150, 20

##  INPUT SHAPER - calibrated 2026-09-15, the machine's first ever.
##  SHAPER_CALIBRATE on the EBB36 v1.2's onboard ADXL345. Full fit:
##
##    X:  zv 67.2Hz 1.2%  | mzv 68.4Hz 0.0%  | ei 81.8Hz 0.0%
##    Y:  zv 48.6Hz 1.0%  | mzv 49.4Hz 0.0%  | ei 59.0Hz 0.0%
##
##  Klipper recommended mzv/X and *zv*/Y. We use mzv on BOTH, deliberately.
##  Klipper picks zv for Y because it costs less "smoothing" - which only buys
##  you a higher acceleration ceiling (zv 9200 vs mzv 7200). This machine's
##  slicer runs 3500, well under both, so that headroom is worth nothing here
##  while zv's extra 1.0% residual vibration is a real loss. At 3500, mzv is
##  strictly better. If the accelerations are ever pushed past ~7000, revisit.
##
##  Y is the softer axis (48.6 vs 68.4 Hz) - expected on a Trident, where Y
##  moves the whole gantry and X moves only the toolhead.
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 68.4
shaper_type_y: mzv
shaper_freq_y: 49.4


##  FIRMWARE RETRACTION - added 2026-09-17.
##  Values mirror the SuperSlicer printer profile exactly, so behaviour is
##  unchanged until something deliberately overrides them.
##
##  Added to make retraction TUNABLE IN ONE PRINT via
##      TUNING_TOWER COMMAND=SET_RETRACTION PARAMETER=RETRACT_LENGTH ...
##  instead of re-slicing once per candidate value.
##
##  NOTE: the slicer still has use_firmware_retraction = 0, so normal prints
##  are unaffected by this section - SuperSlicer emits its own G1 E moves.
##  Only gcode that explicitly uses G10/G11 (the retraction test) is governed
##  by these numbers.
[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

