[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

##  Lets a single object be cancelled off a multi-part plate without killing
##  the whole print - the difference between losing one part and losing a
##  22 hour job.
##
##  Needs two things beyond this section:
##    - SuperSlicer: gcode_label_objects = 1   (already set)
##    - Moonraker:   [file_manager] enable_object_processing: True
##  Moonraker rewrites the slicer's "; printing object" comments into
##  EXCLUDE_OBJECT_DEFINE markers AS THE FILE IS UPLOADED, so files already
##  on the printer will not have them. Re-upload anything that needs it.
[exclude_object]

##  Both boards are addressed by-id, not by-path.
##
##  by-path names a physical USB socket on the Pi. Unplug both boards to work
##  on the machine, plug them back the other way round, and Klipper does not
##  error - it attaches the Octopus config to the EBB36 and vice versa, with
##  stepper and heater pins pointing at the wrong board.
##
##  by-id names the board by its own serial number, so a swapped cable is
##  simply found on the other port. Reflashing a board changes nothing here;
##  replacing one means updating its line.
##
##  Previous values, if ever needed:
##    mcu       by-path ...usb-0:1.3:1.0   (Pi port 1.3)
##    mcu ebb36 by-path ...usb-0:1.1:1.0   (Pi port 1.1)
[mcu]
##  BigTreeTech Octopus, STM32F446
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_3D002E001550535556323420-if00

[mcu ebb36]
##  BigTreeTech EBB36, STM32G0B1, over USB (not CAN)
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_11001D000F504B5735313720-if00

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 3000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

