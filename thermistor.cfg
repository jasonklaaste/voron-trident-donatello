[temperature_sensor chamber]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF5
##  A disconnected sensor reads absurdly cold and a shorted one absurdly hot.
##  These bounds are what catches that. Do not widen them to silence an error.
min_temp: 0
max_temp: 100
gcode_id: chamber

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor ebb36_temp]
sensor_type: temperature_mcu
sensor_mcu: ebb36 
min_temp: 0
max_temp: 100
