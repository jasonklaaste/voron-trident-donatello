#[output_pin caselight]
# Chamber Lighting - HE2 Connector (Optional)
#pin: PB10
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

[neopixel btt_mini12864]
##  Boot colour changed green -> white 2026-09-15. These are RGB order and
##  read acceptably neutral at equal PWM, unlike the chamber strip.
pin: EXP1_6
chain_count: 3
initial_RED: 1
initial_GREEN: 1
initial_BLUE: 1
color_order: RGB

[neopixel chamber]
##  CORRECTED 2026-09-15 - chain_count was 48, but only 24 addresses exist.
##
##  The 48 physical LEDs are wired as TWO RUNS OF 24 IN PARALLEL: both runs
##  receive the same data, which is why the chamber lighting is mirrored
##  left/right. Data for addresses 25-48 runs off the end of each 24-LED run
##  and lights nothing. Proven by setting 1-24 to four colour groups and 25-48
##  to off - eight mirrored blocks appeared and NOTHING went dark.
##
##  Practical consequence: SET_LED ... INDEX=25..48 is silently a no-op, and
##  anything that tries to address the strip as 48 will appear to do nothing.
##  LED 1 is at the CENTRE of each run; LED 24 is at the outer end.
##
##  color_order GRB is correct - verified, red/green/blue/white all displayed
##  as sent. (An earlier reading of this as an R/G swap was wrong; it was two
##  adjacent same-coloured blocks being read as one.)
pin: PA15
chain_count: 24
color_order: GRB

##  White balance, chosen by eye 2026-09-15 against a four-zone ladder.
##  At R=G=B=1 these LEDs read distinctly yellow - the red and green dies are
##  more efficient than blue, so equal PWM is not neutral. Blue is pinned at
##  maximum and red/green pulled down to meet it; there is no way to cool the
##  white other than by attenuating the other two.
##  Previous boot colour was magenta (1, 0, 1).
##  Revised 2026-09-16. The first pass (0.35 / 0.68 / 1.0) fixed the yellow but
##  overshot into GREEN - that value was matched to the Stealthburner LEDs,
##  which turn out to be a different LED type with a different die balance.
##  The chamber strip needs its own numbers; do not assume one white fits both.
##  Chosen from a whole-strip sequential A/B cycle (scratchpad wb_cycle.sh)
##  rather than side-by-side zones, which are harder to judge.
initial_RED: 0.50
initial_GREEN: 0.36
initial_BLUE: 1

#  Set RGB values on boot up for each Neopixel. 
#  Index 1 = display, Index 2 and 3 = Knob
# [delayed_gcode setdisplayneopixel]
# initial_duration: 0.1
# gcode:
#        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=1 INDEX=1 TRANSMIT=0
#        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=1 INDEX=2 TRANSMIT=0
#        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=1 INDEX=3 

