[bed_mesh]
speed: 200
##  MUST stay inside the Eddy's calibrated range (0.05-4.05 mm). At the old
##  value of 10 a scan-mode mesh fails with
##  'probe_eddy_current sensor not in valid range'. BTT specify ~2 mm.
horizontal_move_z: 2
mesh_min: 30, 30
mesh_max: 240, 240
probe_count: 5, 3
mesh_pps: 2, 3
algorithm: bicubic
bicubic_tension: 0.2

##  CRITICAL - do not remove.
##
##  Without zero_reference_position, Klipper applies the mesh using RAW probed
##  values. This machine's probed values average about -5.2mm, while
##  z_calibration (Klicky auto-Z) separately establishes Z=0 on every print via
##  CALIBRATE_Z. Two mechanisms both defining zero, with nothing telling the
##  mesh to nest inside auto-Z's answer, so the offsets stack and the nozzle is
##  driven millimetres into the bed. That is what burned the PEI sheet.
##
##  Evidence the raw values cannot be trusted absolutely: the 2023 mesh averaged
##  -1.9 and the 2026-09-01 mesh averaged -5.2, on the same bed. The absolute
##  value depends on machine state at mesh time.
##
##  150,150 matches z_calibration's bed_xy_position, so the mesh is expressed
##  relative to the exact point auto-Z has already calibrated.
##
##  Any profile saved BEFORE this line existed holds un-normalised points and is
##  unsafe to load. Re-calibrate rather than reusing one.
zero_reference_position: 150, 150

