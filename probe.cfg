[probe]
# x_offset: 0
# y_offset: 25.0
# z_offset: 0
# speed: 10.0
# samples: 3
# samples_result: median
# sample_retract_dist: 3.0
# samples_tolerance: 0.006
# samples_tolerance_retries: 3

# klicky
# pin: PG12
pin: ebb36:PB6
x_offset: 0
y_offset: 19.75
z_offset: 6.42
speed: 5
samples:3 
samples_result: median
##  KEPT LOOSE DELIBERATELY - see below. Tightening these breaks Z_TILT_ADJUST.
##
##  The probe itself is healthy: after the dock was cleaned on 2026-08-31,
##  PROBE_ACCURACY at (150,150) gives 0.0063mm range / 0.0015mm std dev in a
##  single cluster. 0.01 tolerance should be easy.
##
##  It is not. Tightening to 0.01/3 retries on 2026-08-31 made Z_TILT_ADJUST
##  fail at ONE point - (150,245), directly in front of the rear-centre Z
##  leadscrew - and only on the second pass, after the Z motors had moved
##  ~6.5mm. Samples there split into two clusters 0.031mm apart, each
##  internally tight (0.002mm). The other two points stayed clean at 0.0013mm.
##
##  That is mechanical play in the rear-centre Z drive (stepper_z1), not a
##  probe fault. Check the leadscrew, lead nut and especially the coupler
##  grub screws before tightening these again.
##  Evidence: ../tuning/2026-08-31-probe-accuracy.md
sample_retract_dist: 3.0
samples_tolerance: 0.02
samples_tolerance_retries: 5

[idle_timeout]
timeout: 1800

# [safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
# home_xy_position:165,299
# speed: 100
# z_hop:10

[z_tilt]
z_positions:
  -50, 18
  150, 348
  350, 18
points:
  30, 5
  150, 245
  270, 5
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
