[probe]
# x_offset: 0
# y_offset: 25.0
# z_offset: 0
# speed: 10.0
# samples: 3
# samples_result: median
# sample_retract_dist: 2.0
# samples_tolerance: 0.006
# samples_tolerance_retries: 5

# klicky
# pin: PG12
pin: ebb36:PB6
x_offset: 0
y_offset: 19.75
z_offset: 6.42
speed: 5
samples:3 
samples_result: median
##  Tolerance restored to 0.01 on 2026-08-31 after two mechanical fixes.
##
##  These had been loosened to 0.02 as a workaround for two faults, neither of
##  which was the probe:
##    1. Klicky dock magnets - the probe seated in one of two positions 0.025mm
##       apart. Cleaned: PROBE_ACCURACY went 0.0375mm -> 0.0063mm range,
##       std dev 0.0146 -> 0.0015, single cluster.
##    2. Play in the bed's leadscrew mounts. Z_TILT_ADJUST failed at (150,245)
##       with a 0.031mm split. Front two mounts tightened: that point now
##       probes three identical samples, and the residual has dropped to
##       ~0.010mm near (270,5) by the front-right screw.
##
##  Retries is 5, not the original 3. (270,5) once needed all three, which is
##  no margin; retries cost nothing when they are not used. sample_retract_dist
##  is left at 3.0 - it was never part of either fault.
##
##  Verified: Z_TILT_ADJUST converges with ZERO sample-tolerance retries,
##  final range 0.003125mm against a 0.0075mm tolerance.
##
##  If probing starts failing again, suspect the front-right leadscrew mount
##  before touching these numbers. Evidence: ../tuning/2026-08-31-probe-accuracy.md
sample_retract_dist: 3.0
samples_tolerance: 0.01
samples_tolerance_retries: 5

[idle_timeout]
timeout: 1800

# [safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
# home_xy_position:165,299
# speed: 100
# z_hop:10

[z_tilt]
z_positions:
  -50, 18
  150, 348
  350, 18
points:
  30, 5
  150, 245
  270, 5
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
