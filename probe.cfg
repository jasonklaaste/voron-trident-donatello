##############################################################################
##  KLICKY PROBE - DISABLED 2026-09-04, superseded by BTT Eddy Coil v1.1
##
##  probe_eddy_current calls printer.add_object('probe', self) unconditionally,
##  so it and [probe] cannot coexist. The whole Klicky section is preserved
##  below, commented, so it can be restored by uncommenting if the Eddy is
##  removed. Its history and tolerance reasoning are worth keeping.
##############################################################################

#[probe]
# x_offset: 0
# y_offset: 25.0
# z_offset: 0
# speed: 10.0
# samples: 3
# samples_result: median
# sample_retract_dist: 2.0
# samples_tolerance: 0.006
# samples_tolerance_retries: 5

# klicky
# pin: PG12
#pin: ebb36:PB6
#x_offset: 0
#y_offset: 19.75
#z_offset: 6.42
#speed: 5
#samples:3 
#samples_result: median
##  Tolerance restored to 0.01 on 2026-08-31 after two mechanical fixes.
##
##  These had been loosened to 0.02 as a workaround for two faults, neither of
##  which was the probe:
##    1. Klicky dock magnets - the probe seated in one of two positions 0.025mm
##       apart. Cleaned: PROBE_ACCURACY went 0.0375mm -> 0.0063mm range,
##       std dev 0.0146 -> 0.0015, single cluster.
##    2. Play in the bed's leadscrew mounts. Z_TILT_ADJUST failed at (150,245)
##       with a 0.031mm split. Front two mounts tightened: that point now
##       probes three identical samples, and the residual has dropped to
##       ~0.010mm near (270,5) by the front-right screw.
##
##  Retries is 5, not the original 3. (270,5) once needed all three, which is
##  no margin; retries cost nothing when they are not used. sample_retract_dist
##  is left at 3.0 - it was never part of either fault.
##
##  Verified: Z_TILT_ADJUST converges with ZERO sample-tolerance retries,
##  final range 0.003125mm against a 0.0075mm tolerance.
##
##  If probing starts failing again, suspect the front-right leadscrew mount
##  before touching these numbers. Evidence: ../tuning/2026-08-31-probe-accuracy.md
#sample_retract_dist: 3.0
#samples_tolerance: 0.01
#samples_tolerance_retries: 5


##############################################################################
##  BTT Eddy Coil v1.1 - added 2026-09-04
##  I2C to the EBB36 on i2c3 (PB3/PB4) - both pins verified free.
##  Requires EBB36 on Klipper >= 0.12.0-297; it is on v0.13.0-78 since
##  2026-09-01, which is what made this possible at all.
##
##  !!! OFFSETS BELOW ARE PLACEHOLDERS - NOT MEASURED !!!
##  x/y_offset depend on the physical mount; z_offset must be set by
##  PROBE_EDDY_CURRENT_CALIBRATE. Do NOT probe or home until these are done.
##############################################################################

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: ebb36
i2c_bus: i2c3_PB3_PB4
##  x/y measured by Jason 2026-09-04: coil sits ~23 mm BEHIND the nozzle,
##  no sideways offset (standard Stealthburner X-carriage position).
##  Eyeballed, so +/- a couple of mm - refine if z_tilt/mesh look off-target.
x_offset: 0
y_offset: 23.0
##  z_offset is set by PROBE_EDDY_CURRENT_CALIBRATE - do not hand-edit.
z_offset: 1.0
##  3 samples averaged - single-shot gave 0.011 mm range; averaging should
##  cut that by ~sqrt(3).
samples: 3
samples_result: average

[idle_timeout]
timeout: 1800

##  ENABLED 2026-09-04 - replaces the Klicky [homing_override].
##  Z homes on the physical endstop at PG6; the Eddy is fixed to the
##  toolhead and takes no part in homing.
[safe_z_home]
##  Bed centre - the coil must be over the plate to home Z on the probe.
home_xy_position: 150,150
speed: 100
z_hop: 10
z_hop_speed: 15

[z_tilt]
z_positions:
  -50, 18
  150, 348
  350, 18
points:
  30, 5
  150, 245
  270, 5
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
